<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agatha Avatar Viewer</title>
  </head>
  <body>
    <div id="app">
      <aside class="viewer-panel" aria-label="Avatar controls">
        <header class="panel-header">
          <h1>Avatar Studio</h1>
          <span id="model-state" class="state-pill">Loading</span>
        </header>

        <nav class="tabs" role="tablist" aria-label="Studio views">
          <button id="tab-viewer" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-viewer" data-tab="viewer">Viewer</button>
          <button id="tab-stage" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-stage" data-tab="stage">Stage</button>
          <button id="tab-rig" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-rig" data-tab="rig">Rig</button>
        </nav>

        <section id="panel-viewer" class="tab-panel" role="tabpanel" aria-labelledby="tab-viewer" data-panel="viewer">
          <label class="field">
            <span>Avatar</span>
            <select id="avatar-select">
              <option value="/models/avaAvatar.vrm">Ava Avatar</option>
              <option value="/models/VRM1_Constraint_Twist_Sample.vrm">VRM Twist Sample</option>
              <option value="/models/cube.gltf">Block Man</option>
            </select>
          </label>

          <div class="field">
            <span>Custom Path</span>
            <div class="inline-control">
              <input id="avatar-url" type="url" placeholder="/models/avatar.vrm" />
              <button id="load-url" type="button">Load</button>
            </div>
          </div>

          <label class="field file-field">
            <span>Local File</span>
            <input id="avatar-file" type="file" accept=".vrm,.glb,.gltf,model/gltf-binary,model/gltf+json" />
          </label>

          <div class="control-row">
            <button id="reset-camera" type="button">Reset View</button>
            <label class="toggle">
              <input id="auto-rotate" type="checkbox" checked />
              <span>Auto Rotate</span>
            </label>
          </div>

          <dl class="model-meta" aria-label="Model details">
            <div>
              <dt>Source</dt>
              <dd id="meta-source">-</dd>
            </div>
            <div>
              <dt>Format</dt>
              <dd id="meta-format">-</dd>
            </div>
            <div>
              <dt>Meshes</dt>
              <dd id="meta-meshes">-</dd>
            </div>
            <div>
              <dt>Triangles</dt>
              <dd id="meta-triangles">-</dd>
            </div>
          </dl>
        </section>

        <section id="panel-stage" class="tab-panel" role="tabpanel" aria-labelledby="tab-stage" data-panel="stage" hidden>
          <label class="field">
            <span>Background</span>
            <input id="background-color" type="color" value="#f4f7f8" />
          </label>

          <label class="toggle toggle-row">
            <input id="grid-visible" type="checkbox" checked />
            <span>Show Grid</span>
          </label>

          <label class="field">
            <span>Grid Size</span>
            <select id="grid-size">
              <option value="2">Small</option>
              <option value="4" selected>Medium</option>
              <option value="8">Large</option>
              <option value="12">Wide</option>
            </select>
          </label>

          <label class="field">
            <span>Key Light <output id="key-light-value" for="key-light">2.3</output></span>
            <input id="key-light" type="range" min="0" max="5" step="0.1" value="2.3" />
          </label>

          <label class="field">
            <span>Fill Light <output id="hemi-light-value" for="hemi-light">1.7</output></span>
            <input id="hemi-light" type="range" min="0" max="4" step="0.1" value="1.7" />
          </label>

          <button id="reset-stage" type="button">Reset Stage</button>
        </section>

        <section id="panel-rig" class="tab-panel" role="tabpanel" aria-labelledby="tab-rig" data-panel="rig" hidden>
          <label class="field">
            <span>Bone Set</span>
            <select id="rig-mode">
              <option value="humanoid">VRM Humanoid</option>
              <option value="raw">Raw Bones</option>
            </select>
          </label>

          <label class="field">
            <span>Search</span>
            <input id="rig-search" type="search" placeholder="Filter bones..." />
          </label>

          <div class="control-stack">
            <label class="toggle toggle-row">
              <input id="skeleton-visible" type="checkbox" />
              <span>Skeleton Overlay</span>
            </label>
            <label class="toggle toggle-row">
              <input id="selected-axes-visible" type="checkbox" checked />
              <span>Selected Axes</span>
            </label>
          </div>

          <div class="rig-list-header">
            <span>Bones</span>
            <output id="rig-count">0</output>
          </div>
          <div id="bone-list" class="bone-list" aria-label="Bone list"></div>
          <p id="bone-empty" class="empty-note" hidden>No bones found for this view.</p>

          <dl class="bone-details" aria-label="Selected bone details">
            <div>
              <dt>Name</dt>
              <dd id="bone-name">-</dd>
            </div>
            <div>
              <dt>Source</dt>
              <dd id="bone-source">-</dd>
            </div>
            <div>
              <dt>Parent</dt>
              <dd id="bone-parent">-</dd>
            </div>
            <div>
              <dt>Children</dt>
              <dd id="bone-children">-</dd>
            </div>
            <div>
              <dt>Local Pos</dt>
              <dd id="bone-local-position">-</dd>
            </div>
            <div>
              <dt>Local Rot</dt>
              <dd id="bone-local-rotation">-</dd>
            </div>
            <div>
              <dt>World Pos</dt>
              <dd id="bone-world-position">-</dd>
            </div>
          </dl>
        </section>
      </aside>

      <main class="viewport-shell" aria-label="Avatar preview">
        <div id="viewport"></div>
        <div id="load-progress" class="progress-line" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
